name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render free tier from sleeping (which happens after 15 mins of inactivity)
    - cron: "*/12 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          # If your backend URL is different, update it here or use a GitHub Secret
          URL=${BACKEND_URL:-"https://moneypal.onrender.com/"}
          echo "Pinging backend at $URL..."

          # Using curl with a timeout to fail fast if it doesn't respond
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 $URL)

          if [ "$response" -eq 200 ]; then
            echo "Successfully pinged backend. Status: $response"
          else
            echo "Failed to ping backend or received non-200 status. Status: $response"
            # We exit 0 anyway because we just want to wake it up, and if it's starting up it might time out.
          fi
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
